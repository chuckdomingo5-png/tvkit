name: Build launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp launcher/app/build/outputs/apk/release/app-release.apk tvkit-home.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tvkit-home-apk
          path: tvkit-home.apk
